name: "Docker Hub & GHCR Release"

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v0.5.3)"
        required: true

env:
  GHCR_REGISTRY_IMAGE: ghcr.io/steel97/oxicloud

jobs:
  # Build and push multi-arch image
  build-and-push:
    name: Build & Push Multi-Arch
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build the exact tag behind the published release or manual dispatch.
          ref: ${{ github.event.inputs.version || github.event.release.tag_name || github.ref }}

      - name: Set version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Strip leading 'v' if present for Docker tag
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY_IMAGE }}:${{ env.VERSION }}
            ${{ env.GHCR_REGISTRY_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # GitHub Actions env piped through so build.rs stamps
          # GIT_HASH/GIT_BRANCH into the published binary — without
          # these, `oxicloud --version` would report "unknown" because
          # the build container has no .git/ and the workflow env
          # isn't auto-visible to RUN steps.
          build-args: |
            VERSION=${{ env.VERSION }}
            GITHUB_SHA=${{ github.sha }}
            GITHUB_REF_NAME=${{ github.ref_name }}
            GITHUB_HEAD_REF=${{ github.head_ref }}
